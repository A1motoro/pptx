[build]
publish = "dist"
command = "pnpm run build"

[build.environment]
NODE_VERSION = "20"
BASE_PATH = "/"

[[redirects]]
from = "/.well-known/*"
to = "/.well-known/:splat"
status = 200

[[redirects]]
from = "/1/*"
to = "/1/index.html"
status = 200

[[redirects]]
from = "/2/*"
to = "/2/index.html"
status = 200

[[redirects]]
from = "/3/*"
to = "/3/index.html"
status = 200

[[redirects]]
from = "/4/*"
to = "/4/index.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
